name: basic-usage

on:
  workflow_dispatch:

jobs:
  preflight-example:
    runs-on: ubuntu-latest
    steps:
      - name: Example compatibility invocation
        uses: ./
        continue-on-error: true
        with:
          authority-url: "https://example-authority.company.tld/admit"
          authority-pubkey: "sha256:replace-with-pinned-authority-pubkey"
          policy-id: "ai-secrets-v1"
          trust-verdict: "PASS"

      - name: Example note
        if: ${{ always() }}
        run: |
          echo "This compatibility Action intentionally fails closed after preflight."
          echo "It does not call the canonical installed runtime."
          echo "It does not provide a customer production authority integration."
