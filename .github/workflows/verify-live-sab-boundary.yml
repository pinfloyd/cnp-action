name: verify-public-boundary-contract

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

jobs:
  verify-public-boundary-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify published canonical proof status
        shell: bash
        run: |
          set -euo pipefail
          URL="https://ai-admissibility.com/proof-status.json?ts=$(date +%s)"
          STATUS=$(curl -sS -H 'Cache-Control: no-cache' -o proof-status.json -w "%{http_code}" "$URL")
          echo "PROOF_STATUS_HTTP=$STATUS"
          test "$STATUS" = "200"
          python3 - <<'PY'
          import json
          obj=json.load(open("proof-status.json","r",encoding="utf-8"))
          if obj.get("schema") != "ai-admissibility-proof-status-v2":
              raise SystemExit("PROOF_STATUS_SCHEMA_MISMATCH")
          if obj.get("overall_status") != "PASS":
              raise SystemExit("PROOF_STATUS_NOT_PASS")
          summary=obj.get("public_summary") or {}
          required={
              "canonical_boundary_identity":"verified",
              "public_identity_endpoint":"protected",
              "anonymous_admission":"rejected",
              "request_path_online":"verified",
              "canonical_pilot_path_online":"verified",
              "private_deployment_path_online":"verified",
          }
          for key, expected in required.items():
              if summary.get(key) != expected:
                  raise SystemExit(f"{key.upper()}_MISMATCH")
          auth=obj.get("canonical_authority") or {}
          if auth.get("authority_id") != "AI_BOUNDARY_RELEASE_V1":
              raise SystemExit("AUTHORITY_ID_MISMATCH")
          expected="070ecb8410d8a261b0c173f9f1c42022f5c8d946a42d4b8b402e3460656480d4"
          if auth.get("public_key_sha256") != expected:
              raise SystemExit("AUTHORITY_PUBKEY_SHA256_MISMATCH")
          print("PUBLISHED_CANONICAL_STATUS=PASS")
          print("AUTHORITY_ID="+auth["authority_id"])
          print("AUTHORITY_PUBKEY_SHA256="+auth["public_key_sha256"])
          PY

      - name: Verify anonymous public gate remains closed
        shell: bash
        run: |
          set -euo pipefail
          PUBKEY_STATUS=$(curl -sS -o pubkey-response.txt -w "%{http_code}" "https://admit.ai-admissibility.com/pubkey")
          echo "PUBLIC_PUBKEY_STATUS=$PUBKEY_STATUS"
          case "$PUBKEY_STATUS" in
            401|403|404) ;;
            *) echo "Unexpected public pubkey status"; exit 1 ;;
          esac

          ADMIT_STATUS=$(curl -sS -o admit-response.txt -w "%{http_code}" -X POST "https://admit.ai-admissibility.com/admit" -H "Content-Type: application/json" --data-binary '{"invalid":"github-public-contract-probe"}')
          echo "ANONYMOUS_INVALID_ADMIT_STATUS=$ADMIT_STATUS"
          case "$ADMIT_STATUS" in
            400|401|403|404) ;;
            *) echo "Anonymous invalid admission was not rejected"; exit 1 ;;
          esac

          echo "PUBLIC_GATE_PROTECTION=PASS"

      - name: Verify canonical public routes
        shell: bash
        run: |
          set -euo pipefail
          for URL in "https://ai-admissibility.com/" "https://ai-admissibility.com/canonical-pilot/" "https://ai-admissibility.com/request" "https://ai-admissibility.com/private-deployment"
          do
            STATUS=$(curl -sS -L -o /dev/null -w "%{http_code}" "$URL")
            echo "$URL -> $STATUS"
            test "$STATUS" = "200"
          done
          echo "CANONICAL_PUBLIC_ROUTES=PASS"

      - name: Final public contract summary
        shell: bash
        run: |
          set -euo pipefail
          echo "PUBLIC_BOUNDARY_CONTRACT=PASS"
          echo "CANONICAL_IDENTITY_FROM_PROOF_STATUS=PASS"
          echo "PUBLIC_GATE_PROTECTED=PASS"
          echo "ANONYMOUS_ADMISSION_REJECTED=PASS"
          echo "CANONICAL_PUBLIC_ROUTES=PASS"
          echo "NON_CLAIM=this workflow does not bypass the protected gate or exercise customer execution"
