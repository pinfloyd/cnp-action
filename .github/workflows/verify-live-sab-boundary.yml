name: verify-live-sab-boundary

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

jobs:
  verify-live-sab-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe pubkey and pinned authority identity
        shell: bash
        run: |
          set -euo pipefail
          STATUS=$(curl -sS -o pubkey.json -w "%{http_code}" "https://admit.ai-admissibility.com/pubkey")
          echo "PUBKEY_STATUS=$STATUS"
          test "$STATUS" = "200"
          test -s pubkey.json
          python3 - <<'PY'
          import json
          obj=json.load(open("pubkey.json","r",encoding="utf-8"))
          expected_authority="HOSTED_L5_AUTHORITY_V2"
          expected_pubkey_sha256="37ab852e61fdae19eff05f19e201a2aa9cd43cad82f731d0b61919f4f9a517b9"
          actual_authority=obj.get("authority_id","")
          actual_pubkey_sha256=obj.get("public_key_sha256","")
          print("ACTUAL_AUTHORITY_ID="+actual_authority)
          print("ACTUAL_PUBKEY_SHA256="+actual_pubkey_sha256)
          if actual_authority != expected_authority: raise SystemExit("AUTHORITY_ID_MISMATCH")
          if actual_pubkey_sha256 != expected_pubkey_sha256: raise SystemExit("PUBKEY_SHA256_MISMATCH")
          print("PUBKEY_IDENTITY_CHECK=PASS")
          PY

      - name: Prove raw legacy bypass shape is blocked
        shell: bash
        run: |
          set -euo pipefail
          printf '{"legacy":"raw_bypass_probe","payload":"OPENAI_API_KEY=probe"}' > bad_shape.json
          STATUS=$(curl -sS -o bad_shape_response.json -w "%{http_code}" -X POST "https://admit.ai-admissibility.com/admit" -H "Content-Type: application/json" --data-binary @bad_shape.json)
          echo "BAD_SHAPE_STATUS=$STATUS"
          cat bad_shape_response.json
          test "$STATUS" = "400"
          python3 - <<'PY'
          import json
          obj=json.load(open("bad_shape_response.json","r",encoding="utf-8"))
          err=obj.get("error","")
          req=obj.get("required","")
          print("BAD_SHAPE_ERROR="+err)
          print("BAD_SHAPE_REQUIRED="+req)
          if err != "unsupported_admit_shape": raise SystemExit("BAD_SHAPE_NOT_BLOCKED_AS_EXPECTED")
          if "admit_request" not in req: raise SystemExit("BAD_SHAPE_REQUIRED_CONTRACT_MISSING")
          print("BAD_SHAPE_BLOCK_CHECK=PASS")
          PY

      - name: Build SAB-wrapped synthetic safe request
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json
          lines=["CONFIG_OK=1"]
          joined="\n".join(lines)+"\n"
          intent={"schema":"intent-v1","repo":"pinfloyd/cnp-action","ref":"refs/heads/main","policy_id":"ai-secrets-v1","added_lines":lines,"added_lines_sha256":hashlib.sha256(joined.encode("utf-8")).hexdigest()}
          wrapped={"tier":"EVALUATION","admit_request":intent}
          open("safe_wrapped.json","w",encoding="utf-8").write(json.dumps(wrapped,separators=(",",":")))
          print("SAFE_WRAPPED_SHA256="+hashlib.sha256(open("safe_wrapped.json","rb").read()).hexdigest())
          PY
          test -s safe_wrapped.json

      - name: Assert SAB-wrapped synthetic safe request fails closed
        shell: bash
        run: |
          set -euo pipefail
          STATUS=$(curl -sS -o safe_response.json -w "%{http_code}" -X POST "https://admit.ai-admissibility.com/admit" -H "Content-Type: application/json" --data-binary @safe_wrapped.json)
          echo "SAFE_STATUS=$STATUS"
          cat safe_response.json
          test "$STATUS" = "200"
          python3 - <<'PY'
          import json
          obj=json.load(open("safe_response.json","r",encoding="utf-8"))
          record=obj.get("record") or {}
          decision=record.get("decision") or obj.get("decision") or obj.get("verdict")
          signature=obj.get("signature","")
          tier_gate=obj.get("tier_gate") or {}
          tier_bridge=obj.get("tier_bridge") or {}
          print("SAFE_DECISION="+str(decision))
          print("SAFE_TIER_GATE_TIER="+str(tier_gate.get("tier","")))
          print("SAFE_TIER_BRIDGE_MODE="+str(tier_bridge.get("mode","")))
          if decision != "DENY": raise SystemExit("SYNTHETIC_SAFE_EXPECTED_FAIL_CLOSED_DENY")
          if not signature: raise SystemExit("SAFE_SIGNATURE_MISSING")
          if tier_gate.get("tier") != "EVALUATION": raise SystemExit("SAFE_TIER_GATE_MISSING")
          if not tier_bridge.get("mode"): raise SystemExit("SAFE_TIER_BRIDGE_MISSING")
          print("SYNTHETIC_SAFE_FAIL_CLOSED_CHECK=PASS")
          PY

      - name: Build SAB-wrapped synthetic secret request
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json
          lines=["sk-test-123"]
          joined="\n".join(lines)+"\n"
          intent={"schema":"intent-v1","repo":"pinfloyd/cnp-action","ref":"refs/heads/main","policy_id":"ai-secrets-v1","added_lines":lines,"added_lines_sha256":hashlib.sha256(joined.encode("utf-8")).hexdigest()}
          wrapped={"tier":"EVALUATION","admit_request":intent}
          open("secret_wrapped.json","w",encoding="utf-8").write(json.dumps(wrapped,separators=(",",":")))
          print("SECRET_WRAPPED_SHA256="+hashlib.sha256(open("secret_wrapped.json","rb").read()).hexdigest())
          PY
          test -s secret_wrapped.json

      - name: Assert SAB-wrapped synthetic secret request is DENY
        shell: bash
        run: |
          set -euo pipefail
          STATUS=$(curl -sS -o secret_response.json -w "%{http_code}" -X POST "https://admit.ai-admissibility.com/admit" -H "Content-Type: application/json" --data-binary @secret_wrapped.json)
          echo "SECRET_STATUS=$STATUS"
          cat secret_response.json
          test "$STATUS" = "200"
          python3 - <<'PY'
          import json
          obj=json.load(open("secret_response.json","r",encoding="utf-8"))
          record=obj.get("record") or {}
          decision=record.get("decision") or obj.get("decision") or obj.get("verdict")
          signature=obj.get("signature","")
          tier_gate=obj.get("tier_gate") or {}
          tier_bridge=obj.get("tier_bridge") or {}
          print("SECRET_DECISION="+str(decision))
          print("SECRET_TIER_GATE_TIER="+str(tier_gate.get("tier","")))
          print("SECRET_TIER_BRIDGE_MODE="+str(tier_bridge.get("mode","")))
          if decision != "DENY": raise SystemExit("SECRET_EXPECTED_DENY")
          if not signature: raise SystemExit("SECRET_SIGNATURE_MISSING")
          if tier_gate.get("tier") != "EVALUATION": raise SystemExit("SECRET_TIER_GATE_MISSING")
          if not tier_bridge.get("mode"): raise SystemExit("SECRET_TIER_BRIDGE_MISSING")
          print("SECRET_DENY_CHECK=PASS")
          PY

      - name: Final no-bypass fail-closed proof summary
        shell: bash
        run: |
          set -euo pipefail
          echo "LIVE_SAB_BOUNDARY_PROOF=PASS"
          echo "PUBKEY_IDENTITY=PASS"
          echo "RAW_LEGACY_BYPASS_BLOCKED=PASS"
          echo "SAB_WRAPPED_SYNTHETIC_SAFE_FAIL_CLOSED_DENY=PASS"
          echo "SAB_WRAPPED_SYNTHETIC_SECRET_DENY=PASS"
          echo "SIGNED_RECORD_PRESENT=PASS"
          echo "TIER_GATE_AND_BRIDGE_PRESENT=PASS"
